version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d
    restart: unless-stopped

  gcurl-test:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "php -m | grep gcurl && sh scripts/verify-fingerprint.sh"]
    volumes:
      - .:/var/www/html
